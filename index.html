<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Risk Themes and Key Risk Indicators (KRI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #14213d;
    --navy-2: #1c2d52;
    --ink: #1b2333;
    --sub: #5b6479;
    --bg: #eef1f7;
    --card: #ffffff;
    --border: #e1e5ef;
    --border-soft: #edf0f6;
    --chip-ink: #2b3a63;
    --shadow: 0 1px 2px rgba(20,33,61,.06), 0 8px 24px -12px rgba(20,33,61,.18);

    --c1: #2f6fed; --c1-soft: #eaf1ff; /* Strategic */
    --c2: #12938a; --c2-soft: #e5f6f4; /* Operational */
    --c3: #7c4fe0; --c3-soft: #f1ecfd; /* Financial */
    --c4: #d68a1a; --c4-soft: #fdf1df; /* Compliance */
    --c5: #d1425a; --c5-soft: #fbe8ec; /* Technology / Cyber */
    --c6: #2e9e5b; --c6-soft: #e7f7ee; /* ESG / Sustainability */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Leelawadee UI",sans-serif;
    line-height:1.5;
    padding: 40px 24px 80px;
  }

  .page{ max-width: 1320px; margin: 0 auto; }

  .masthead{ margin-bottom: 24px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"Inter",sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color: var(--c1);
    background: #eaf1ff; border:1px solid #d7e4ff; padding:5px 12px; border-radius:999px;
    margin-bottom:14px;
  }
  h1{
    font-family:"Inter",sans-serif;
    font-size: clamp(24px, 3vw, 32px);
    font-weight:800; letter-spacing:-.01em;
    color: var(--navy); margin:0 0 8px;
  }
  .subtitle{ color: var(--sub); font-size:16px; margin:0; }

  .stats{
    display:grid; grid-template-columns: repeat(3, 1fr);
    gap:14px; margin: 22px 0 28px;
  }
  .stat{
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow: var(--shadow); padding:18px 20px;
    display:flex; align-items:center; gap:14px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .stat:hover{
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(20,33,61,.08), 0 16px 28px -16px rgba(20,33,61,.28);
  }
  .stat-icon{
    flex:0 0 auto; width:46px; height:46px; border-radius:13px;
    display:flex; align-items:center; justify-content:center;
    background: var(--stat-soft, var(--c1-soft)); color: var(--stat-accent, var(--c1));
  }
  .stat-icon svg{ width:22px; height:22px; }
  .stat-text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .stat-num{
    font-family:"Inter",sans-serif; font-size:26px; font-weight:800;
    color: var(--navy); line-height:1.15;
  }
  .stat-label{ color: var(--sub); font-size:13px; font-weight:500; }

  .toolbar{
    display:flex; align-items:center; justify-content:flex-end; gap:16px;
    flex-wrap:wrap; margin-bottom:16px;
  }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"Sarabun",sans-serif; font-size:13.5px; font-weight:600;
    color:#fff; background: var(--navy); border:1px solid var(--navy);
    padding:9px 16px; border-radius:9px; cursor:pointer;
    transition: background .15s ease, transform .05s ease;
  }
  .btn:hover{ background: var(--navy-2); }
  .btn:active{ transform: translateY(1px); }
  .btn svg{ width:15px; height:15px; flex:0 0 auto; }

  .layout{
    display:grid; grid-template-columns: 300px 1fr;
    gap:20px; align-items:start;
  }

  .domain-nav{
    display:flex; flex-direction:column; gap:4px;
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    padding:10px; box-shadow: var(--shadow);
    position:sticky; top:24px;
  }

  .nav-item{
    all:unset; box-sizing:border-box;
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:11px; cursor:pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  .nav-item:hover{ background:#f5f7fc; }
  .nav-item.active{ background: var(--soft, #eaf1ff); }

  .nav-badge{
    flex:0 0 auto; width:28px; height:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Inter",sans-serif; font-weight:800; font-size:13px;
    color:#fff; background: var(--accent, var(--c1));
  }
  .nav-text{ flex:1 1 auto; min-width:0; }
  .nav-name{
    display:block; font-family:"Inter",sans-serif; font-weight:700; font-size:13.5px;
    color: var(--navy); letter-spacing:-.005em;
  }
  .nav-item.active .nav-name{ color: var(--accent, var(--c1)); }
  .nav-count{ display:block; font-size:11.5px; color: var(--sub); margin-top:1px; }

  .detail-panel{
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow: var(--shadow); overflow:hidden;
    border-left: 5px solid var(--accent, var(--c1));
    min-height: 320px;
  }

  .panel-header{
    display:flex; align-items:center; gap:16px;
    padding:22px 24px; border-bottom:1px solid var(--border-soft);
  }
  .panel-badge{
    flex:0 0 auto; width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Inter",sans-serif; font-weight:800; font-size:17px;
    color:#fff; background: var(--accent, var(--c1));
  }
  .panel-name{
    font-family:"Inter",sans-serif; font-weight:700; font-size:19px;
    color: var(--navy); letter-spacing:-.01em;
  }
  .panel-count{ font-size:13px; color: var(--sub); margin-top:3px; }
  .panel-count b{ color: var(--accent, var(--c1)); font-weight:700; }

  .theme-list{ display:flex; flex-direction:column; }

  .theme-item{ border-top:1px solid var(--border-soft); }
  .theme-item:first-child{ border-top:none; }

  .theme-header{
    display:flex; align-items:flex-start; gap:10px;
    padding:15px 24px 15px 44px; cursor:pointer; user-select:none;
  }
  .theme-header:hover{ background:#fbfcfe; }

  .theme-num{
    flex:0 0 auto; min-width:28px; height:20px; padding:0 5px; border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Inter",sans-serif; font-weight:700; font-size:11px;
    color:#fff; background: var(--accent, var(--c1)); margin-top:1px;
  }
  .theme-text{
    flex:1 1 auto; min-width:0;
    display:flex; flex-direction:column; gap:4px;
  }
  .theme-title{
    font-weight:600; color: var(--navy); font-size:14.5px; line-height:1.45;
  }
  .theme-focus{
    color: var(--sub); font-size:13px; line-height:1.5;
  }
  .theme-focus b{
    color: var(--sub); font-weight:600;
  }
  .theme-chev{
    flex:0 0 auto; width:16px; height:16px; color:#9aa2b6; margin-top:3px;
    transition: transform .22s ease;
  }
  .theme-item.open .theme-chev{ transform: rotate(180deg); }

  .theme-body{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .25s ease;
  }
  .theme-item.open .theme-body{ grid-template-rows: 1fr; }
  .theme-body-inner{ overflow:hidden; }

  .theme-detail{
    padding:2px 24px 18px 82px;
    display:flex; flex-direction:column; gap:12px;
  }

  .kri-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .kri-list li{
    display:flex; align-items:flex-start; gap:8px;
    font-size:13.5px; color: var(--chip-ink); line-height:1.4;
  }
  .kri-list li::before{
    content:""; flex:0 0 auto; width:6px; height:6px; border-radius:50%;
    background: var(--accent, var(--c1)); margin-top:6px;
  }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .domain-nav{
      flex-direction:row; overflow-x:auto; position:static;
      gap:8px; padding:8px;
    }
    .nav-item{ flex:0 0 auto; padding:9px 12px; }
    .nav-count{ display:none; }
    .theme-header{ padding:14px 16px 14px 32px; }
    .theme-detail{ padding:2px 16px 14px 70px; }
    .panel-header{ padding:18px 16px; }
  }

  @media (max-width: 560px){
    .stats{ grid-template-columns: 1fr; }
  }

  @media print{
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .domain-nav{ display:none; }
    .layout{ grid-template-columns: 1fr; }
    .theme-body{ grid-template-rows: 1fr !important; }
    .detail-panel{ box-shadow:none; }
    .theme-chev{ display:none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <span class="eyebrow">Risk Management Portal</span>
    <h1>Corporate Risk Themes and Key Risk Indicators (KRI)</h1>
    <p class="subtitle">กรอบติดตามความเสี่ยงระดับ Corporate ภายใต้ 6 Risk Domains</p>
  </div>

  <div class="stats">
    <div class="stat" style="--stat-accent:var(--c1);--stat-soft:var(--c1-soft)">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      <span class="stat-text">
        <span class="stat-num">6</span>
        <span class="stat-label">Risk Domains</span>
      </span>
    </div>
    <div class="stat" style="--stat-accent:var(--c3);--stat-soft:var(--c3-soft)">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
      </span>
      <span class="stat-text">
        <span class="stat-num">8</span>
        <span class="stat-label">Corporate Risk Themes</span>
      </span>
    </div>
    <div class="stat" style="--stat-accent:var(--c2);--stat-soft:var(--c2-soft)">
      <span class="stat-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="18" y1="20" x2="18" y2="14"/></svg>
      </span>
      <span class="stat-text">
        <span class="stat-num">15</span>
        <span class="stat-label">Corporate KRI</span>
      </span>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="downloadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
      Download Excel
    </button>
  </div>

  <div class="layout">
    <nav class="domain-nav" id="domainNav"></nav>
    <section class="detail-panel" id="detailPanel"></section>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DATA = [
  {
    num: 1, name: "Strategic Risk", accent: "var(--c1)", soft: "var(--c1-soft)",
    themes: [
      {
        title: "การดำเนินกลยุทธ์และการลงทุน",
        focus: "การลงทุนสำคัญของกลุ่ม Strategic Initiatives, New Business, Capacity Expansion ดำเนินการและสร้างผลตอบแทนตาม Business Case หรือไม่",
        kris: ["% โครงการเชิงกลยุทธ์ที่ล่าช้ากว่าแผน", "% โครงการลงทุนที่คาดว่าจะให้ผลตอบแทนต่ำกว่า Business Case"]
      },
      {
        title: "การกระจุกตัวของรายได้",
        focus: "กลุ่มบริษัทพึ่งพารายได้จากลูกค้ารายใหญ่หรือ Revenue Stream ใดมากเกินไปหรือไม่",
        kris: ["สัดส่วนรายได้จากลูกค้า 5 อันดับแรกต่อรายได้รวม", "สัดส่วนรายได้จาก Revenue Stream ที่มีสัดส่วนสูงสุดต่อรายได้รวม"]
      }
    ]
  },
  {
    num: 2, name: "Operational Risk", accent: "var(--c2)", soft: "var(--c2-soft)",
    themes: [
      {
        title: "ความต่อเนื่องทางธุรกิจ",
        focus: "ความพร้อมของแผนรองรับความต่อเนื่องทางธุรกิจ (BCP) และความสามารถในการกู้คืนการดำเนินงานเมื่อเกิดเหตุการณ์วิกฤต",
        kris: ["% ของ Critical Business Process ที่ BCP ยังไม่พร้อมใช้งาน", "% ของ Critical Business Process ที่ไม่สามารถกู้คืนได้ภายใน RTO"]
      }
    ]
  },
  {
    num: 3, name: "Financial Risk", accent: "var(--c3)", soft: "var(--c3-soft)",
    themes: [
      {
        title: "การสร้างรายได้และผลกำไร",
        focus: "รายได้และ EBITDA เทียบเป้าหมาย",
        kris: ["% รายได้รวมเทียบเป้าหมาย", "% EBITDA รวมเทียบเป้าหมาย"]
      },
      {
        title: "ความมั่นคงทางการเงินและสภาพคล่อง",
        focus: "กระแสเงินสด สภาพคล่อง และการเรียกเก็บเงินของบริษัทย่อย",
        kris: ["สัดส่วนลูกหนี้ค้างชำระเกิน 90 วัน"]
      }
    ]
  },
  {
    num: 4, name: "Compliance Risk", accent: "var(--c4)", soft: "var(--c4-soft)",
    themes: [
      {
        title: "การปฏิบัติตามกฎหมายและข้อกำหนด",
        focus: "การปฏิบัติตามกฎหมาย ใบอนุญาต สัมปทาน และข้อกำหนดสำคัญของหน่วยงานกำกับดูแล",
        kris: ["จำนวนกรณีไม่ปฏิบัติตามกฎหมายหรือข้อกำหนดของหน่วยงานกำกับที่มีนัยสำคัญ", "% ของภาระหน้าที่ตามกฎหมายและข้อกำหนดที่ดำเนินการล่าช้ากว่ากำหนด"]
      }
    ]
  },
  {
    num: 5, name: "Technology / Cyber Risk", accent: "var(--c5)", soft: "var(--c5-soft)",
    themes: [
      {
        title: "ความพร้อมและเสถียรภาพของเทคโนโลยี",
        focus: "ความพร้อมของระบบ IT / OT / ERP / SCADA / Automation ที่สนับสนุนการผลิตและการดำเนินธุรกิจ",
        kris: ["ระยะเวลาหยุดชะงักของการดำเนินงานจากความขัดข้องของระบบเทคโนโลยีสำคัญ", "จำนวนเหตุการณ์ด้าน Cyber ระดับสูงหรือวิกฤต"]
      }
    ]
  },
  {
    num: 6, name: "ESG Risk", accent: "var(--c6)", soft: "var(--c6-soft)",
    themes: [
      {
        title: "สิ่งแวดล้อม ความปลอดภัย และความยั่งยืน",
        focus: "การปล่อยก๊าซเรือนกระจก ความปลอดภัยในการทำงาน และเหตุการณ์ด้านสิ่งแวดล้อมที่อาจกระทบต่อการดำเนินธุรกิจ",
        kris: ["อัตราการบาดเจ็บจากการทำงานถึงขั้นหยุดงาน (LTIFR)", "การปล่อยก๊าซเรือนกระจกเทียบเป้าหมาย"]
      }
    ]
  }
];

const domainNavEl = document.getElementById('domainNav');
const detailPanelEl = document.getElementById('detailPanel');

let activeIndex = 0;

function renderKris(kris){
  return kris.map(k => `<li>${k}</li>`).join('');
}

function renderThemeItem(theme, label){
  return `
    <div class="theme-item" data-theme>
      <div class="theme-header" data-theme-toggle>
        <span class="theme-num">${label}</span>
        <div class="theme-text">
          <div class="theme-title">${theme.title}</div>
          <div class="theme-focus"><b>ติดตาม:</b> ${theme.focus}</div>
        </div>
        <svg class="theme-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="theme-body">
        <div class="theme-body-inner">
          <div class="theme-detail">
            <ul class="kri-list">${renderKris(theme.kris)}</ul>
          </div>
        </div>
      </div>
    </div>`;
}

function renderNav(){
  domainNavEl.innerHTML = DATA.map((g, i) => `
      <button class="nav-item ${i===activeIndex?'active':''}" data-domain="${i}" style="--accent:${g.accent};--soft:${g.soft}">
        <span class="nav-badge">${g.num}</span>
        <span class="nav-text">
          <span class="nav-name">${g.name}</span>
          <span class="nav-count">${g.themes.length} Risk Theme${g.themes.length > 1 ? 's' : ''}</span>
        </span>
      </button>`
  ).join('');
}

function renderPanel(index){
  const g = DATA[index];
  detailPanelEl.style.setProperty('--accent', g.accent);
  detailPanelEl.innerHTML = `
    <div class="panel-header">
      <span class="panel-badge">${g.num}</span>
      <div>
        <div class="panel-name">${g.name}</div>
        <div class="panel-count"><b>${g.themes.length}</b> Risk Theme${g.themes.length > 1 ? 's' : ''}</div>
      </div>
    </div>
    <div class="theme-list">
      ${g.themes.map((t, i) => renderThemeItem(t, `${g.num}.${i + 1}`)).join('')}
    </div>`;
}

function openAllThemes(){
  detailPanelEl.querySelectorAll('[data-theme]').forEach(item => item.classList.add('open'));
}

function selectDomain(index){
  activeIndex = index;
  renderNav();
  renderPanel(index);
  openAllThemes();
}

domainNavEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-domain]');
  if(!btn) return;
  selectDomain(Number(btn.dataset.domain));
});

detailPanelEl.addEventListener('click', (e) => {
  const header = e.target.closest('[data-theme-toggle]');
  if(!header) return;
  header.closest('[data-theme]').classList.toggle('open');
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const rows = [];
  DATA.forEach(g => {
    g.themes.forEach(t => {
      t.kris.forEach(k => {
        rows.push({
          "Risk Domain": `${g.num}. ${g.name}`,
          "Corporate Risk Theme": t.title.replace(/&amp;/g, '&'),
          "ประเด็นที่ Corporate ควรติดตาม": t.focus,
          "Corporate KRI": k
        });
      });
    });
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 26 }, { wch: 38 }, { wch: 50 }, { wch: 50 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Risk Themes & KRI");
  XLSX.writeFile(wb, "Corporate_Risk_Themes_and_KRI.xlsx");
});

renderNav();
renderPanel(activeIndex);
openAllThemes();
</script>
</body>
</html>
