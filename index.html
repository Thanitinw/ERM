<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Risk Themes and Key Risk Indicators (KRI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #14213d;
    --navy-2: #1c2d52;
    --ink: #1b2333;
    --sub: #5b6479;
    --bg: #eef1f7;
    --card: #ffffff;
    --border: #e1e5ef;
    --border-soft: #edf0f6;
    --chip-ink: #2b3a63;
    --shadow: 0 1px 2px rgba(20,33,61,.06), 0 8px 24px -12px rgba(20,33,61,.18);

    --c1: #2f6fed; --c1-soft: #eaf1ff; /* Strategic */
    --c2: #12938a; --c2-soft: #e5f6f4; /* Operational */
    --c3: #7c4fe0; --c3-soft: #f1ecfd; /* Financial */
    --c4: #d68a1a; --c4-soft: #fdf1df; /* Compliance */
    --c5: #d1425a; --c5-soft: #fbe8ec; /* Technology / Cyber */
    --c6: #2e9e5b; --c6-soft: #e7f7ee; /* ESG / Sustainability */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: "Sarabun","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Leelawadee UI",sans-serif;
    line-height:1.5;
    padding: 40px 24px 80px;
  }

  .page{ max-width: 1320px; margin: 0 auto; }

  .masthead{ margin-bottom: 24px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"Inter",sans-serif; font-size:12px; font-weight:700;
    letter-spacing:.09em; text-transform:uppercase; color: var(--c1);
    background: #eaf1ff; border:1px solid #d7e4ff; padding:5px 12px; border-radius:999px;
    margin-bottom:14px;
  }
  h1{
    font-family:"Inter",sans-serif;
    font-size: clamp(24px, 3vw, 32px);
    font-weight:800; letter-spacing:-.01em;
    color: var(--navy); margin:0 0 8px;
  }
  .subtitle{ color: var(--sub); font-size:16px; margin:0; }

  .stats{
    display:flex; flex-wrap:wrap; gap:12px;
    margin: 22px 0 26px;
  }
  .stat{
    background: var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 18px; box-shadow: var(--shadow);
    display:flex; align-items:baseline; gap:8px;
  }
  .stat b{ font-family:"Inter",sans-serif; font-size:20px; color: var(--navy); }
  .stat span{ color: var(--sub); font-size:13px; }

  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:16px;
  }
  .search{
    position:relative; flex: 1 1 260px; max-width:320px;
  }
  .search input{
    width:100%; font-family:"Sarabun",sans-serif; font-size:14px;
    padding:9px 14px 9px 36px; border-radius:9px; border:1px solid var(--border);
    background: var(--card); color:var(--ink); outline:none;
  }
  .search input:focus{ border-color: var(--c1); box-shadow:0 0 0 3px #2f6fed22; }
  .search svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:#9aa2b6; pointer-events:none;
  }

  .layout{
    display:grid; grid-template-columns: 300px 1fr;
    gap:20px; align-items:start;
  }

  .domain-nav{
    display:flex; flex-direction:column; gap:4px;
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    padding:10px; box-shadow: var(--shadow);
    position:sticky; top:24px;
  }

  .nav-item{
    all:unset; box-sizing:border-box;
    display:flex; align-items:center; gap:12px;
    padding:11px 12px; border-radius:11px; cursor:pointer;
    transition: background .15s ease, opacity .15s ease;
  }
  .nav-item:hover{ background:#f5f7fc; }
  .nav-item.active{ background: var(--soft, #eaf1ff); }
  .nav-item.dim{ opacity:.4; }

  .nav-badge{
    flex:0 0 auto; width:28px; height:28px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Inter",sans-serif; font-weight:800; font-size:13px;
    color:#fff; background: var(--accent, var(--c1));
  }
  .nav-text{ flex:1 1 auto; min-width:0; }
  .nav-name{
    display:block; font-family:"Inter",sans-serif; font-weight:700; font-size:13.5px;
    color: var(--navy); letter-spacing:-.005em;
  }
  .nav-item.active .nav-name{ color: var(--accent, var(--c1)); }
  .nav-count{ display:block; font-size:11.5px; color: var(--sub); margin-top:1px; }

  .detail-panel{
    background: var(--card); border:1px solid var(--border); border-radius:16px;
    box-shadow: var(--shadow); overflow:hidden;
    border-left: 5px solid var(--accent, var(--c1));
    min-height: 320px;
  }

  .panel-header{
    display:flex; align-items:center; gap:16px;
    padding:22px 24px; border-bottom:1px solid var(--border-soft);
  }
  .panel-badge{
    flex:0 0 auto; width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:"Inter",sans-serif; font-weight:800; font-size:17px;
    color:#fff; background: var(--accent, var(--c1));
  }
  .panel-name{
    font-family:"Inter",sans-serif; font-weight:700; font-size:19px;
    color: var(--navy); letter-spacing:-.01em;
  }
  .panel-count{ font-size:13px; color: var(--sub); margin-top:3px; }
  .panel-count b{ color: var(--accent, var(--c1)); font-weight:700; }

  .theme-list{ display:flex; flex-direction:column; }

  .theme-item{ border-top:1px solid var(--border-soft); }
  .theme-item:first-child{ border-top:none; }

  .theme-header{
    display:flex; align-items:flex-start; gap:10px;
    padding:15px 24px; cursor:pointer; user-select:none;
  }
  .theme-header:hover{ background:#fbfcfe; }

  .theme-dot{
    flex:0 0 auto; width:7px; height:7px; border-radius:50%;
    background: var(--accent, var(--c1)); margin-top:7px;
  }
  .theme-text{
    flex:1 1 auto; min-width:0;
    display:flex; flex-direction:column; gap:4px;
  }
  .theme-title{
    font-weight:600; color: var(--navy); font-size:14.5px; line-height:1.45;
  }
  .theme-focus{
    color: var(--sub); font-size:13px; line-height:1.5;
  }
  .theme-focus b{
    color: var(--sub); font-weight:600;
  }
  .theme-chev{
    flex:0 0 auto; width:16px; height:16px; color:#9aa2b6; margin-top:3px;
    transition: transform .22s ease;
  }
  .theme-item.open .theme-chev{ transform: rotate(180deg); }

  .theme-body{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .25s ease;
  }
  .theme-item.open .theme-body{ grid-template-rows: 1fr; }
  .theme-body-inner{ overflow:hidden; }

  .theme-detail{
    padding:2px 24px 18px 40px;
    display:flex; flex-direction:column; gap:12px;
  }

  .kri-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .kri-list li{
    display:flex; align-items:flex-start; gap:8px;
    font-size:13.5px; color: var(--chip-ink); line-height:1.4;
  }
  .kri-list li::before{
    content:""; flex:0 0 auto; width:6px; height:6px; border-radius:50%;
    background: var(--accent, var(--c1)); margin-top:6px;
  }

  .no-results{
    display:none; text-align:center; padding:40px 20px; color: var(--sub); font-size:14px;
  }

  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; }
    .domain-nav{
      flex-direction:row; overflow-x:auto; position:static;
      gap:8px; padding:8px;
    }
    .nav-item{ flex:0 0 auto; padding:9px 12px; }
    .nav-count{ display:none; }
    .theme-header{ padding:14px 16px; }
    .theme-detail{ padding:2px 16px 14px 34px; }
    .panel-header{ padding:18px 16px; }
  }

  @media print{
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .domain-nav{ display:none; }
    .layout{ grid-template-columns: 1fr; }
    .theme-body{ grid-template-rows: 1fr !important; }
    .detail-panel{ box-shadow:none; }
    .theme-chev{ display:none; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="masthead">
    <span class="eyebrow">Risk Management Portal</span>
    <h1>Corporate Risk Themes and Key Risk Indicators (KRI)</h1>
    <p class="subtitle">กรอบติดตามความเสี่ยงระดับ Corporate ภายใต้ 6 Risk Domains</p>
  </div>

  <div class="stats">
    <div class="stat"><b>6</b><span>Risk Domains</span></div>
    <div class="stat"><b>8</b><span>Corporate Risk Themes</span></div>
    <div class="stat"><b>18</b><span>Corporate KRI</span></div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหา Risk Theme, ประเด็น หรือ KRI...">
    </div>
  </div>

  <div class="layout">
    <nav class="domain-nav" id="domainNav"></nav>
    <section class="detail-panel" id="detailPanel"></section>
  </div>
  <div class="no-results" id="noResults">ไม่พบรายการที่ตรงกับคำค้นหา</div>

</div>

<script>
const DATA = [
  {
    num: 1, name: "Strategic Risk", accent: "var(--c1)", soft: "var(--c1-soft)",
    themes: [
      {
        title: "ผลการดำเนินงานของกลุ่มไม่เป็นไปตามเป้าหมาย",
        focus: "ผลประกอบการรวม และ Contribution ของแต่ละกลุ่มธุรกิจเทียบกับแผน",
        kris: ["ร้อยละของรายได้รวมเทียบเป้าหมาย", "ร้อยละของ EBITDA รวมเทียบเป้าหมาย"]
      },
      {
        title: "การดำเนินกลยุทธ์และการลงทุนไม่เป็นไปตามแผน",
        focus: "Strategic Initiatives, New Business, Capacity Expansion และการลงทุนสำคัญของกลุ่ม ว่าดำเนินการและสร้างผลตอบแทนตาม Business Case หรือไม่",
        kris: ["ร้อยละของโครงการเชิงกลยุทธ์ที่ล่าช้ากว่าแผน", "ร้อยละของโครงการลงทุนที่คาดว่าจะให้ผลตอบแทนต่ำกว่า Business Case"]
      },
      {
        title: "การกระจุกตัวและการพึ่งพาทางธุรกิจ",
        focus: "การพึ่งพาลูกค้ารายใหญ่ กลุ่มธุรกิจ หรือแหล่งรายได้ใดมากเกินไป",
        kris: ["สัดส่วนรายได้จากลูกค้า 5 อันดับแรกต่อรายได้รวม", "สัดส่วนรายได้จากกลุ่มธุรกิจที่มีสัดส่วนสูงสุดต่อรายได้รวม"]
      }
    ]
  },
  {
    num: 2, name: "Operational Risk", accent: "var(--c2)", soft: "var(--c2-soft)",
    themes: [
      {
        title: "ความต่อเนื่องและความสามารถในการดำเนินธุรกิจ",
        focus: "ความสามารถของธุรกิจสำคัญในการผลิต ส่งมอบโครงการ ผลิตไฟฟ้า จัดหาวัตถุดิบ และให้บริการได้ต่อเนื่อง",
        kris: ["สัดส่วนรายได้ของกลุ่มที่อยู่ภายใต้ความเสี่ยงด้านการดำเนินงานระดับสูง", "สัดส่วนรายได้หรือ Backlog ที่มีความเสี่ยงจากปัญหาการดำเนินงาน"]
      }
    ]
  },
  {
    num: 3, name: "Financial Risk", accent: "var(--c3)", soft: "var(--c3-soft)",
    themes: [
      {
        title: "ความมั่นคงทางการเงินและกระแสเงินสดของกลุ่ม",
        focus: "Cash Flow, Liquidity และความสามารถในการเรียกเก็บเงินของบริษัทย่อย รวมถึงเงินสดที่บริษัทแม่สามารถนำมาใช้ได้",
        kris: ["ร้อยละของกระแสเงินสดจากการดำเนินงานเทียบแผน", "สัดส่วนลูกหนี้การค้าที่ค้างชำระเกิน 90 วัน", "ระดับเงินสดหรือวงเงินสภาพคล่องคงเหลือเทียบเกณฑ์"]
      }
    ]
  },
  {
    num: 4, name: "Compliance Risk", accent: "var(--c4)", soft: "var(--c4-soft)",
    themes: [
      {
        title: "Compliance &amp; Sustainability",
        focus: "กฎหมาย ใบอนุญาต สัมปทาน เงื่อนไขสัญญา หรือข้อกำหนดสำคัญที่หากไม่ปฏิบัติตามอาจกระทบการดำเนินธุรกิจ",
        kris: ["จำนวนเหตุการณ์ไม่ปฏิบัติตามกฎหมายหรือข้อกำหนดที่มีนัยสำคัญ", "จำนวนใบอนุญาตหรือเงื่อนไขสำคัญที่มีความเสี่ยงไม่เป็นไปตามข้อกำหนด"]
      }
    ]
  },
  {
    num: 5, name: "Technology / Cyber Risk", accent: "var(--c5)", soft: "var(--c5-soft)",
    themes: [
      {
        title: "ความต่อเนื่องและความสามารถในการดำเนินธุรกิจ",
        focus: "ความพร้อมของระบบ IT / OT / ERP / SCADA และระบบ Digital ที่สำคัญต่อการดำเนินงานของกลุ่ม",
        kris: ["ระยะเวลาที่ระบบเทคโนโลยีสำคัญไม่สามารถใช้งานได้", "ร้อยละความพร้อมใช้งานของระบบเทคโนโลยีสำคัญ", "จำนวนเหตุการณ์ด้าน Cyber ระดับสูงหรือวิกฤต"]
      }
    ]
  },
  {
    num: 6, name: "ESG / Sustainability Risk", accent: "var(--c6)", soft: "var(--c6-soft)",
    themes: [
      {
        title: "Compliance &amp; Sustainability",
        focus: "เป้าหมายด้านสิ่งแวดล้อม ความปลอดภัย ชุมชน และ Sustainability ที่มีนัยสำคัญต่อกลุ่ม",
        kris: ["ร้อยละของตัวชี้วัด ESG สำคัญที่ต่ำกว่าเป้าหมาย", "จำนวนเหตุการณ์ด้านสิ่งแวดล้อม ความปลอดภัย หรือชุมชนที่มีนัยสำคัญ"]
      }
    ]
  }
];

const domainNavEl = document.getElementById('domainNav');
const detailPanelEl = document.getElementById('detailPanel');
const searchInput = document.getElementById('searchInput');
const noResults = document.getElementById('noResults');

let activeIndex = 0;

function themeSearchStr(theme){
  return (theme.title+' '+theme.focus+' '+theme.kris.join(' ')).toLowerCase();
}

function domainMatchCount(domain, q){
  if(!q) return domain.themes.length;
  return domain.themes.filter(t => themeSearchStr(t).includes(q)).length;
}

function renderKris(kris){
  return kris.map(k => `<li>${k}</li>`).join('');
}

function renderThemeItem(theme){
  return `
    <div class="theme-item" data-theme data-search="${themeSearchStr(theme)}">
      <div class="theme-header" data-theme-toggle>
        <span class="theme-dot"></span>
        <div class="theme-text">
          <div class="theme-title">${theme.title}</div>
          <div class="theme-focus"><b>ติดตาม:</b> ${theme.focus}</div>
        </div>
        <svg class="theme-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="theme-body">
        <div class="theme-body-inner">
          <div class="theme-detail">
            <ul class="kri-list">${renderKris(theme.kris)}</ul>
          </div>
        </div>
      </div>
    </div>`;
}

function renderNav(q){
  domainNavEl.innerHTML = DATA.map((g, i) => {
    const count = domainMatchCount(g, q);
    const dim = q && count === 0;
    return `
      <button class="nav-item ${i===activeIndex?'active':''} ${dim?'dim':''}" data-domain="${i}" style="--accent:${g.accent};--soft:${g.soft}">
        <span class="nav-badge">${g.num}</span>
        <span class="nav-text">
          <span class="nav-name">${g.name}</span>
          <span class="nav-count">${g.themes.length} Risk Theme${g.themes.length > 1 ? 's' : ''}</span>
        </span>
      </button>`;
  }).join('');
}

function renderPanel(index){
  const g = DATA[index];
  detailPanelEl.style.setProperty('--accent', g.accent);
  detailPanelEl.innerHTML = `
    <div class="panel-header">
      <span class="panel-badge">${g.num}</span>
      <div>
        <div class="panel-name">${g.name}</div>
        <div class="panel-count"><b>${g.themes.length}</b> Risk Theme${g.themes.length > 1 ? 's' : ''}</div>
      </div>
    </div>
    <div class="theme-list">
      ${g.themes.map(renderThemeItem).join('')}
    </div>`;
}

function applyFilter(q){
  const items = detailPanelEl.querySelectorAll('[data-theme]');
  let anyMatch = false;
  items.forEach(item => {
    const match = !q || item.dataset.search.includes(q);
    item.style.display = match ? '' : 'none';
    if(match){ anyMatch = true; item.classList.add('open'); }
  });
  return anyMatch;
}

function selectDomain(index){
  activeIndex = index;
  const q = searchInput.value.trim().toLowerCase();
  renderNav(q);
  renderPanel(index);
  const anyMatch = applyFilter(q);
  noResults.style.display = (q && !anyMatch) ? 'block' : 'none';
}

domainNavEl.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-domain]');
  if(!btn) return;
  selectDomain(Number(btn.dataset.domain));
});

detailPanelEl.addEventListener('click', (e) => {
  const header = e.target.closest('[data-theme-toggle]');
  if(!header) return;
  header.closest('[data-theme]').classList.toggle('open');
});

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();

  if(q){
    const counts = DATA.map(g => domainMatchCount(g, q));
    if(counts[activeIndex] === 0){
      const firstIdx = counts.findIndex(c => c > 0);
      if(firstIdx !== -1){
        activeIndex = firstIdx;
        renderPanel(activeIndex);
      }
    }
  }

  renderNav(q);
  const anyMatch = applyFilter(q);
  noResults.style.display = (q && !anyMatch) ? 'block' : 'none';
});

renderNav('');
renderPanel(activeIndex);
applyFilter('');
</script>
</body>
</html>
